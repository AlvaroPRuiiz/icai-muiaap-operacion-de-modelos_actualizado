[project]
name = "wine-quality"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Álvaro Poveda", email = "alvaro.poveda.ruiz@alumnos.upm.es" }
]
requires-python = ">=3.13"
dependencies = [
    "pandas",
    "scikit-learn",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
wine-quality = "wine_quality:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
